# Dicionário de habilidades do radar de vagas (F3).
#
# Formato:   Nome canônico:
#              categoria: tecnica | ferramenta | comportamental | idioma
#              aliases: [outras formas de escrever a mesma habilidade]
#
# Regras:
# - O NOME CANÔNICO é o que aparece nas saídas. Ele precisa ser igual ao nome
#   usado nos currículos ("SQL", "Python", "Power BI", "Redes de computadores"...),
#   porque a comparação vaga x currículo é feita pelo nome canônico.
# - O próprio nome canônico já conta como alias; não precisa repeti-lo.
# - Acentos e maiúsculas não importam: tudo é normalizado antes de comparar.
# - Na busca em texto, o alias MAIS LONGO vence ("sql server" antes de "sql").
# - Alterar este arquivo muda a versão do cache das extrações por regras.

